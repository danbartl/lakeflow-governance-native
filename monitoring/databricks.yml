bundle:
  name: governance-pipeline-monitoring
  engine: direct
  databricks_cli_version: '>= 1.25.0, <= 1.25.0'

variables:
  warehouse_id:
    description: SQL warehouse with access to the regional pipeline events system table.

resources:
  dashboards:
    pipeline_quality:
      display_name: Pipeline Quality
      file_path: .databricks/board.lvdash.json
      warehouse_id: ${var.warehouse_id}

targets:
  dev:
    default: true
    mode: development
