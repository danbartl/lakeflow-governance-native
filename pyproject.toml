[project]
name = "lakeflow-governance-native"
version = "0.1.0"
description = "Native Lakeflow governance qualification slice"
requires-python = ">=3.12,<3.13"
dependencies = ["databricks-sdk>=0.139,<1", "pydantic>=2.13.5,<3", "pyyaml>=6.0.3,<7"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["pipelines/first_slice/tests", "monitoring/tests", "semantics/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
